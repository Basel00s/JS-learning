<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wk10</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--the main style file-->
    <link rel="stylesheet" href="./css/style.css">
    <!--media quiry-->
    <link rel="stylesheet" href="./css/media.css">
    <!--fonts files-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="container">

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="pn" placeholder=" ">
            <label for="pn">Product Name</label>
        </div>
        <div class="form-floating mb-3">
            <input type="number" class="form-control" id="pp" placeholder=" ">
            <label for="pp">Product Price</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" list="list" class="form-control" id="pc" placeholder=" ">
            <label for="pc">Product Category</label>
            <datalist id="list">
                <option value="Electronic"></option>
                <option value="Food"></option>
                <option value="Building tools"></option>
                <option value="Clothes"></option>
            </datalist>
        </div>
        <div class="form-floating mb-3">
            <input type="file" accept="image/*" class="form-control" id="img" placeholder=" ">
            <label for="img">Product Image</label>
        </div>
        <div class="form-floating mb-3">
            <textarea class="form-control" id="pd" placeholder=" " maxlength="200"></textarea>
            <label for="pd">Product Description</label>

        </div>

        <button class="btn btn-outline-primary w-100 mb-1 ripple-btn" onclick="addNewProduct()" id="addProductBtn">
            <span class="btn-text">Enter Product</span>
            <span class="loading-spinner d-none" id="loadingSpinner"></span>
        </button>

        <button class="btn btn-outline-secondary w-100 mb-1 ripple-btn" onclick="display()">Display</button>
        <button class="btn btn-outline-danger w-100 mb-1 ripple-btn" onclick="clr()">Clear</button>

        <div id="product" class="row mt-5">
            <div class="col-lg-2 col-md-3">
                <div class="product">
                </div>
            </div>
        </div>
        





    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>

</body>

</html>
