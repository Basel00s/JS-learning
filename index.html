<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wk10</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--the main style file-->
    <link rel="stylesheet" href="./css/style.css">
    <!--media quiry-->
    <link rel="stylesheet" href="./css/media.css">
    <!--fonts files-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!--font awesome-->
    <link rel="stylesheet" href="./css/all.min.css">
</head>

<body>
    <!-- Decorative gradient blobs -->
    <div class="deco-blob deco-blob-1"></div>
    <div class="deco-blob deco-blob-2"></div>
    <div class="deco-blob deco-blob-3"></div>

    <div class="container">
        <div class="page-title">
            <h1>📦 Product Manager</h1>
            <span class="title-underline"></span>
        </div>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="pn" placeholder=" ">
            <label for="pn">Product Name</label>
        </div>
        <div class="form-floating mb-3">
            <input type="number" class="form-control" id="pp" placeholder=" ">
            <label for="pp">Product Price</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" list="list" class="form-control" id="pc" placeholder=" ">
            <label for="pc">Product Category</label>
            <datalist id="list">
                <option value="Electronic"></option>
                <option value="Food"></option>
                <option value="Building tools"></option>
                <option value="Clothes"></option>
            </datalist>
        </div>
        <div class="form-floating mb-3">
            <input type="file" accept="image/*" class="form-control" id="img" placeholder=" ">
            <label for="img">Product Image</label>
        </div>
        <div class="form-floating mb-3">
            <textarea class="form-control" id="pd" placeholder=" " maxlength="200"></textarea>
            <label for="pd">Product Description</label>
            <div class="char-counter">
                <span id="charCount">0</span>/200
                <div class="char-progress">
                    <div class="char-progress-bar" id="charProgressBar"></div>
                </div>
            </div>
        </div>
        <div id="successMsg" class="alert alert-success d-none text-center bounce-in" role="alert">
            ✅ Product Added Successfully!
            <span class="product-count-badge" id="productCountBadge">0</span>
        </div>
        <button class="btn btn-outline-primary w-100 mb-1 ripple-btn" onclick="addNewProduct()" id="addProductBtn">
            <span class="btn-text">Enter Product</span>
            <span class="loading-spinner d-none" id="loadingSpinner"></span>
        </button>
        <button class="btn btn-outline-secondary w-100 mb-1 ripple-btn" onclick="show()">Show Products</button>
        <button class="btn btn-outline-danger w-100 ripple-btn" onclick="confirmClear()">Clear</button>
        <!-- Products Display Container -->
        <div id="productsContainer" class="products-display d-none">
            <div class="products-header">
                <h3>📋 Product List</h3>
                <button class="btn-close btn-close-white" onclick="hideProducts()"></button>
            </div>
            <div id="productsList"></div>
        </div>

        <!-- Confirmation Modal -->
        <div id="confirmModal" class="confirm-modal-overlay d-none">
            <div class="confirm-modal">
                <div class="confirm-modal-icon">⚠️</div>
                <h4>Clear All Products?</h4>
                <p>This action cannot be undone.</p>
                <div class="confirm-modal-buttons">
                    <button class="btn btn-outline-secondary ripple-btn" onclick="cancelClear()">Cancel</button>
                    <button class="btn btn-outline-danger ripple-btn" onclick="clr()">Yes, Clear</button>
                </div>
            </div>
        </div>

        <!-- Floating Particles Container -->
        <div id="particlesContainer" class="particles-container"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/animations.js"></script>
</body>

</html>
